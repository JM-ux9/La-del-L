<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFF8E7">
    <title>Sin conexión | Café del L</title>
    <style>
      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background: #FFF8E7;
        color: #29231f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid rgba(61, 35, 20, 0.1);
        border-radius: 24px;
        background: #fffdf8;
        box-shadow: 0 24px 70px rgba(61, 35, 20, 0.12);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 68px;
        height: 68px;
        margin: 0 auto 1.5rem;
        place-items: center;
        border-radius: 50%;
        background: #f1f3df;
        color: #5c5b2b;
        font-size: 2rem;
      }

      h1 {
        margin: 0;
        color: #3d2314;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
      }

      p {
        margin: 0.8rem 0 1.75rem;
        color: #6c625b;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1.25rem;
        border-radius: 999px;
        background: #3d2314;
        color: #fff8e7;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #81a055;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">☕</div>
      <h1>Estás sin conexión</h1>
      <p>
        Esta página no está guardada en tu dispositivo y no hay conexión a internet.
        Las páginas del catálogo que ya visitaste sí puedes verlas sin conexión.
      </p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
