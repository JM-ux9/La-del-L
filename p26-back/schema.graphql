type AuthPayload {
  accessToken: String!
  refreshToken: String!
  usuario: Usuario!
}

type Categoria {
  id: Int!
  nombre: String!
  productos: [Producto!]!
}

type CategoriaVendida {
  categoriaId: Int!
  nombre: String!
  cantidadVendida: Int!
  totalVendido: Float!
}

type DetallePedido {
  id: Int!
  cantidad: Int!
  importe: Float!
  producto: Producto!
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  crearProducto(datos: ProductoInput!): Producto!
  actualizarProducto(id: Int!, datos: ProductoInput!): Producto
  eliminarProducto(id: Int!): Boolean!
  setInProgress(id: Int!): Boolean!
  setReady(id: Int!): Boolean!
  setDelivered(id: Int!): Boolean!
  setCanceled(id: Int!): Boolean!
  crearPedido(datos: PedidoInput!): Pedido!
  crearUsuario(datos: UsuarioInput!): Usuario
  login(datos: LoginInput!): AuthPayload!
  refrescarToken(refreshToken: String!): RefreshPayload!
  logout(refreshToken: String!): Boolean!
  updateUsuario(name: String!): Boolean!
  resetPassword(pswd: String!, newPswd: String!): Boolean!
  ascendUser(id: Int!): Boolean!
  actualizarNombreUsuario(id: Int!, nombre: String!): Boolean!
  eliminarUsuario(id: Int!): Boolean!
  descendUser(id: Int!): Boolean!
}

type Pedido {
  id: Int!
  fecha: String!
  total: Float!
  status: String!
  usuario: Usuario!
  detalles: [DetallePedido!]!
}

input PedidoInput {
  renglones: [RenglonInput!]!
}

type Producto {
  id: Int!
  nombre: String!
  precio: Float!
  imagen: String
  disponible: Boolean
  categoria: Categoria!
}

input ProductoInput {
  nombre: String!
  precio: Float!
  imagen: String = null
  categoria: Int!
  disponible: Boolean = null
}

type ProductoVendido {
  productoId: Int!
  nombre: String!
  cantidadVendida: Int!
  totalVendido: Float!
}

type Query {
  productos(limite: Int = null, desde: Int = null): [Producto!]!
  producto(id: Int!): Producto
  categorias: [Categoria!]!
  categoria(id: Int!): Categoria
  pedidosPagados(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidosListos(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidosEntregados(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidosRechazados(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidosCancelados(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidosEnProceso(limite: Int = null, desde: Int = null): [Pedido!]!
  pedidos(limite: Int = null, desde: Int = null): [Pedido!]!
  misPedidos: [Pedido!]!
  pedidosByClienteId(id: Int!): [Pedido!]!
  productosMasVendidos(limite: Int = null): [ProductoVendido!]!
  ventasSemana: [VentaDia!]!
  ventasMes: [VentaDia!]!
  ventas5Dias: [VentaDia!]!
  avgWeek: Float!
  avgMonth: Float!
  categoriasMasVendidas: [CategoriaVendida!]!
  listarUsuarios: [Usuario!]!
  userById(id: Int!): Usuario
}

type RefreshPayload {
  accessToken: String!
  refreshToken: String!
}

input RenglonInput {
  productoId: Int!
  cantidad: Int!
}

enum RolEnum {
  ADMIN
  CLIENTE
}

type Subscription {
  pedidosEnVivo: Pedido!
  pedidoActualizado(pedidoId: Int!): Pedido!
  misPedidosActivos: Pedido!
}

type Usuario {
  id: Int!
  nombre: String!
  email: String!
  rol: RolEnum!
}

input UsuarioInput {
  nombre: String!
  email: String!
  password: String!
}

type VentaDia {
  fecha: String!
  total: Float!
  pedidos: Int!
}
